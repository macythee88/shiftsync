<!doctype html>
<html lang="zh-TW"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ShiftSync 餐飲智慧排班與考勤</title>
<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#14202b;--mute:#5d6b78;--line:#d3dae1;--blue:#1f5fbf;--bb:#e3edfb;--amb:#a66f00;--ab:#fff4d1;--red:#c8372d;--rb:#fde7e4;--grn:#1e8e5a;--gb:#dcf3e8;--cy:#0a7f84;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#10171e;--card:#18222c;--ink:#e8eef3;--mute:#93a1ae;--line:#2b3a47;--blue:#6fa3f0;--bb:#1b2f4d;--amb:#f0c14d;--ab:#3a2f0d;--red:#ff8a80;--rb:#43201d;--grn:#5fd49b;--gb:#15392a;--cy:#4fd1d6;--on:#0b1118}}
:root[data-theme=dark]{color-scheme:dark;--bg:#10171e;--card:#18222c;--ink:#e8eef3;--mute:#93a1ae;--line:#2b3a47;--blue:#6fa3f0;--bb:#1b2f4d;--amb:#f0c14d;--ab:#3a2f0d;--red:#ff8a80;--rb:#43201d;--grn:#5fd49b;--gb:#15392a;--cy:#4fd1d6;--on:#0b1118}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
header{background:var(--ink);color:var(--bg);padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header b{font-size:18px;margin-right:auto}
.seg button{border:1px solid currentColor;background:none;color:inherit;padding:6px 14px;font:inherit;cursor:pointer}
.seg button:first-child{border-radius:8px 0 0 8px}.seg button:last-child{border-radius:0 8px 8px 0;border-left:0}
.seg button.on{background:var(--bg);color:var(--ink)}
main{max-width:1100px;margin:0 auto;padding:14px}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
h2{font-size:17px;margin:0 0 10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.mute{color:var(--mute);font-size:13px}
button,select{font:inherit;color:var(--ink)}
.b{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 12px;cursor:pointer;min-height:38px}
.b:hover{border-color:var(--blue)}
.p{background:var(--blue);color:var(--on);border-color:var(--blue)}
.p:disabled{opacity:.4;cursor:not-allowed}
select{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px}
.sc{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:760px}
th,td{border:1px solid var(--line);padding:6px;vertical-align:top;font-size:13px;text-align:left}
th{background:var(--bg)}
td[data-a=cell]{cursor:pointer;min-width:104px}td[data-a=cell]:hover{background:var(--bg)}
.td,th.td{outline:2px solid var(--blue);outline-offset:-2px}
.chip{border-radius:6px;padding:2px 6px;margin:2px 0;font-size:12px;white-space:nowrap}
.ok{background:var(--bb);color:var(--blue);border:1px solid var(--blue)}
.it,.pd{background:var(--ab);color:var(--amb);border:1px dashed var(--amb)}
.rd{background:var(--rb);color:var(--red);border:1px solid var(--red)}
.gp{color:var(--red);font-weight:700}.gk{color:var(--grn)}
.day{border-top:1px solid var(--line);padding:8px 0}.day.f{background:var(--ab)}
.hrs{display:grid;grid-template-columns:repeat(15,minmax(0,1fr));gap:3px;margin-top:6px}.cl{background:var(--bg);color:var(--mute)}
.hrs button{border:1px solid var(--line);background:var(--card);border-radius:6px;min-height:40px;padding:0;cursor:pointer;font-size:13px}
.hrs button.on{background:var(--blue);color:var(--on);border-color:var(--blue)}
.hrs button:disabled{opacity:.35}
.punch{display:flex;flex-direction:column;align-items:center;gap:10px;padding:8px}
.disc{width:190px;height:190px;border-radius:50%;border:0;font-size:22px;font-weight:700;line-height:1.3;color:var(--on);cursor:pointer;position:relative;overflow:hidden;touch-action:none;user-select:none}
.disc.in{background:var(--amb)}.disc.out,.disc.dn{background:var(--cy)}.disc.dn{cursor:default}
.disc::after{content:"";position:absolute;inset:0;background:rgba(255,255,255,.35);transform:translateY(100%)}
.disc.hold::after{transform:translateY(0);transition:transform .5s linear}
.card{border:2px solid var(--red);background:var(--rb);border-radius:10px;padding:12px;margin-bottom:10px}
.big{font-size:28px;font-weight:700}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal>div{border:1px solid var(--line);border-radius:8px;padding:6px;min-height:78px;font-size:12px;overflow:hidden;word-break:break-all}
.cal .c{cursor:pointer}.cal .h{background:var(--bg);text-align:center;min-height:0}.mc{min-width:840px}.mc .chip{white-space:normal}
.tag{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.mask[hidden]{display:none}
.sheet{background:var(--card);width:min(560px,100%);max-height:90%;overflow:auto;border-radius:14px 14px 0 0;padding:16px}
textarea{width:100%;height:240px;font:12px monospace;background:var(--bg);color:var(--ink);border:1px solid var(--line)}
#t{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;z-index:10}
#t[hidden]{display:none}
input{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px;min-height:38px;max-width:100%}
button:focus-visible,select:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
@media(max-width:600px){.hrs{grid-template-columns:repeat(8,minmax(0,1fr))}.hrs button{font-size:11px;min-height:36px}.disc{width:170px;height:170px}}
</style></head><body>
<header><b>ShiftSync 餐飲排班與考勤</b>
<div class="seg" hidden><button data-a="role" data-v="e">員工端</button><button data-a="role" data-v="m">店長端</button></div>
<button class="b" data-a="out" hidden>登出</button></header>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<main id="app"></main>
<div id="lg" class="mask" hidden style="align-items:center"><div class="sheet" style="border-radius:14px;max-width:380px"><h2>ShiftSync 員工排班</h2><div class="row"><input id="le" type="email" placeholder="Email" style="width:100%"></div><div class="row"><input id="lp" type="password" placeholder="密碼" style="width:100%"></div><div id="lm" class="gp"></div><div class="row"><button class="b p" data-a="login" style="width:100%">登入</button></div></div></div>
<div class="mask" id="m" hidden><div class="sheet" id="sh"></div></div>
<div id="t" hidden></div>
<script>
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>{const[a,b,c]=s.split('-');return new Date(+a,+b-1,+c)};
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const mon=d=>addD(d,-((d.getDay()+6)%7));
const fh=h=>pad(Math.floor(h%24))+':'+(h%1?'30':'00');
const ft=h=>pad(Math.floor(h))+':'+pad(Math.floor((h%1)*60));
const WD=['週日','週一','週二','週三','週四','週五','週六'];
const lb=d=>(d.getMonth()+1)+'/'+d.getDate()+' '+WD[d.getDay()];
let EMP=[];const H=[...Array(19)].map((_,i)=>i+7),NEED=3;
const TODAY=new Date();TODAY.setHours(0,0,0,0);const TK=ymd(TODAY);
let S,U={role:'e',emp:'w',wk:mon(TODAY),mm:new Date(TODAY.getFullYear(),TODAY.getMonth(),1),ev:'cal',focus:null};
let CFG=null,st,dirty=0;const ENV=window.SS_ENV||{},sb=ENV.url&&window.supabase?supabase.createClient(ENV.url,ENV.key):null;
const save=()=>{if(!CFG)return;dirty=1;clearTimeout(st);st=setTimeout(push,400)};
async function push(){if(!CFG||!sb)return;try{const mg=CFG.mgr;
 if(mg&&U.role=='e'){
  if(!CFG.me)throw new Error('店長尚未建立自己的員工資料');
  const id=CFG.me,sub={},obj={};
  Object.keys(S.sub).forEach(k=>{if(k.startsWith(id)&&S.sub[k])sub[k.slice(id.length)]=1});
  Object.keys(S.obj).forEach(k=>{if(k.startsWith(id)&&S.obj[k])obj[k.slice(id.length)]=1});
  const a=await sb.from('emp_data').update({av:S.av[id]||{},sub,obj,acks:S.acks?.[id]||{}}).eq('emp_id',id);
  if(a.error)throw a.error;
 }else if(mg){
  const rows=EMP.map(e=>{const id=e.id,sub={},obj={},ac={...(S.acks?.[id]||{})},r={emp_id:id};
   Object.keys(S.sub).forEach(k=>{if(k.startsWith(id)&&S.sub[k])sub[k.slice(id.length)]=1});Object.keys(S.obj).forEach(k=>{if(k.startsWith(id)&&S.obj[k])obj[k.slice(id.length)]=1});
   Object.entries(S.off[id]).forEach(([d,a])=>{if(a.some(x=>x.st=='pend'))delete ac[d]});
   Object.assign(r,{name:e.n,title:e.r,rate:e.rate,email:e.wp||null,off:S.off[id],av:S.av[id]||{},sub,punches:S.at[id],obj,acks:ac});return r});
  let a=await sb.from('emp_data').upsert(rows);if(a.error)throw a.error;
  if(S.gone?.length){a=await sb.from('emp_data').delete().in('emp_id',S.gone);if(a.error)throw a.error;S.gone=[]}
  a=await sb.from('cfg').upsert({id:1,closed:S.closed});if(a.error)throw a.error;
 }else{
  const id=CFG.me,sub={},obj={};
  Object.keys(S.sub).forEach(k=>{if(k.startsWith(id)&&S.sub[k])sub[k.slice(id.length)]=1});
  Object.keys(S.obj).forEach(k=>{if(k.startsWith(id)&&S.obj[k])obj[k.slice(id.length)]=1});
  const a=await sb.from('emp_data').update({av:S.av[id]||{},sub,obj,acks:S.acks?.[id]||{}}).eq('emp_id',id);if(a.error)throw a.error;
 }
 dirty=0}catch(e){dirty=0;toast('同步失敗：'+(e.message||'請重新整理後再試'))}}
const toast=m=>{const t=$('#t');t.textContent=m;t.hidden=false;clearTimeout(toast.i);toast.i=setTimeout(()=>t.hidden=true,2200)};
const rng=hs=>{hs=[...hs].sort((a,b)=>a-b);const r=[];for(const h of hs){const l=r[r.length-1];if(l&&l[1]==h)l[1]=h+1;else r.push([h,h+1])}return r};
const cov=(a,s,e)=>{for(let h=s;h<e;h+=.5)if(!a.includes(Math.floor(h)))return false;return true};
const okS=(id,k)=>(S.off[id]?.[k]||[]).filter(x=>x.st=='ok');
const emp=id=>EMP.find(x=>x.id==id);
const O=x=>Array.isArray(x)?{}:x||{};
function fix(){S.closed=S.closed||{};S.closed.wd=Array.isArray(S.closed.wd)?S.closed.wd:[];S.closed.dates=O(S.closed.dates);S.emps=S.emps||EMP;EMP=S.emps;['off','av','at','obj','sub'].forEach(m=>S[m]=O(S[m]));EMP.forEach(e=>['off','av','at'].forEach(m=>S[m][e.id]=O(S[m][e.id])))}
function blank(){S={closed:{wd:[],dates:{}},emps:[],off:{},av:{},at:{},obj:{},sub:{}};EMP=S.emps}
function boot(){if(CFG){if(!U.init){U.init=1;U.role=CFG.mgr?'m':'e'}const me=EMP.find(x=>x.wp==CFG.login);if(me){CFG.me=me.id;if(!CFG.mgr||U.role=='e')U.emp=me.id}}if(!EMP.find(x=>x.id==U.emp)&&EMP[0])U.emp=EMP[0].id}
async function load(){try{
 const[c,r]=await Promise.all([sb.from('cfg').select('closed').eq('id',1).maybeSingle(),sb.from('emp_data').select('*')]);if(r.error)throw r.error;
 S={closed:c.data?.closed||{wd:[],dates:{}},emps:[],off:{},av:{},at:{},obj:{},sub:{},acks:{},gone:[],notifs:[]};
 r.data.forEach(x=>{const id=x.emp_id,ak=x.acks||{},o={};S.emps.push({id,n:x.name,r:x.title||'員工',rate:+x.rate||0,wp:(x.email||'').toLowerCase()});S.acks[id]=ak;
  Object.entries(x.off||{}).forEach(([d,a])=>o[d]=a.map(v=>({...v,st:v.st=='pend'&&ak[d]?'ok':v.st})));S.off[id]=o;S.av[id]=x.av||{};S.at[id]=x.punches||{};
  Object.keys(x.obj||{}).forEach(k=>S.obj[id+k]=1);Object.keys(x.sub||{}).forEach(k=>S.sub[id+k]=1)});
 fix();CFG.me=S.emps.find(e=>e.wp==CFG.login)?.id;if(CFG.mgr){const nr=await sb.from('manager_notifications').select('*').order('created_at',{ascending:false}).limit(50);if(!nr.error)S.notifs=nr.data||[]}if(!CFG.mgr&&!CFG.me){$('#app').innerHTML='<section><h2>帳號尚未綁定員工資料</h2><p>目前登入帳號沒有對應的員工資料列。請聯絡店長確認員工 Email 與登入帳號一致；系統不會顯示其他員工資料。</p></section>';return}boot();render()}catch(e){toast('載入失敗：'+(e.message||''))}}
let poll;
async function enter(se){const claim=await sb.rpc('claim_me');if(claim.error){showLogin('帳號綁定檢查失敗：'+claim.error.message);return}const m=await sb.rpc('is_mgr');if(m.error){showLogin('權限檢查失敗：'+m.error.message);return}CFG={mgr:!!m.data,login:se.user.email.toLowerCase()};$('#lg').hidden=true;$('[data-a=out]').hidden=false;blank();boot();render();await load();
 if(!poll)poll=setInterval(()=>{if(CFG&&!dirty&&$('#m').hidden&&document.activeElement.tagName!='INPUT'&&!document.querySelector('#disc.hold'))load()},30000)}
async function staff(action,body){const r=await sb.functions.invoke('manage-staff',{body:{action,...body}});
 const m=r.error?(await r.error.context?.json?.().then(j=>j.error).catch(()=>null))||r.error.message:null;if(m){toast('失敗：'+m);return}
 toast(action=='add'?'已新增員工並建立登入帳號':action=='remove'?'已刪除員工與帳號':'已重設密碼');await load()}
function showLogin(t){$('#lg').hidden=false;$('#lm').textContent=t||''}
async function doLogin(){const r=await sb.auth.signInWithPassword({email:$('#le').value.trim(),password:$('#lp').value});if(r.error){showLogin('登入失敗：帳號或密碼錯誤');return}enter(r.data.session)}

async function submitDay(k){const id=CFG?.me||U.emp;if(!id||!emp(id)){toast('找不到員工帳號');return}const vals=S.av[id][k]||[];if(!vals.length){toast('請先選擇時段');return}const action=S.sub[id+k]?'updated':'submitted';const sub={};Object.keys(S.sub).forEach(x=>{if(x.startsWith(id)&&S.sub[x])sub[x.slice(id.length)]=1});sub[k]=1;const up=await sb.from('emp_data').update({av:S.av[id]||{},sub}).eq('emp_id',id);if(up.error){toast('提交失敗：'+up.error.message);return}const n=await sb.from('manager_notifications').insert({emp_id:id,work_date:k,action,details:{hours:vals}});if(n.error){toast('意向已保存，但通知店長失敗：'+n.error.message);return}S.sub[id+k]=1;toast('當天意向已提交，店長已收到通知');render()}
async function cancelDay(k){if(!confirm('確定取消這一天已提交的意向？店長會收到通知。'))return;const id=CFG?.me||U.emp;if(!id)return;const old=[...(S.av[id][k]||[])],av={...S.av[id]};delete av[k];const sub={};Object.keys(S.sub).forEach(x=>{if(x.startsWith(id)&&S.sub[x]&&x.slice(id.length)!==k)sub[x.slice(id.length)]=1});const up=await sb.from('emp_data').update({av,sub}).eq('emp_id',id);if(up.error){toast('取消失敗：'+up.error.message);return}const n=await sb.from('manager_notifications').insert({emp_id:id,work_date:k,action:'cancelled',details:{previous_hours:old}});if(n.error){toast('意向已取消，但通知店長失敗：'+n.error.message);return}S.av[id]=av;delete S.sub[id+k];toast('當天意向已取消，店長已收到通知');render()}

function week(){return[...Array(7)].map((_,i)=>addD(U.wk,i))}
function wkNav(){const t=mon(TODAY),n=addD(t,7),w=ymd(U.wk);return `<div class=row><button class=b data-a=wk data-v=-1>◀ 上一週</button><button class="b ${w==ymd(t)?'p':''}" data-a=wk data-v=0>本週</button><button class="b ${w==ymd(n)?'p':''}" data-a=wk data-v=n>下週（重點提報）</button><button class=b data-a=wk data-v=1>下一週 ▶</button><b>${lb(U.wk)} - ${lb(addD(U.wk,6))}</b></div>`}
function rEmp(){
 if(CFG?.mgr&&!CFG.me)return '<section><h2>建立店長自己的員工資料</h2><p>請填寫自己的資料。這會建立一筆綁定目前店長登入帳號的員工記錄，不會建立新登入帳號，也不會影響其他員工。</p><div class=row><input id=mn placeholder="姓名" required><input id=mt value="店長" placeholder="職位"><input id=mr type=number min=0 step=0.01 placeholder="時薪" style="width:110px"></div><div class=row><button class="b p" data-a=manager-profile>儲存我的資料</button></div></section>';
 if(CFG?.mgr&&CFG.me)U.emp=CFG.me;
 if(!emp(U.emp)&&EMP[0])U.emp=EMP[0].id;if(!EMP.length)return '<section>尚無員工，請店長先到「店長端」新增員工。</section>';if(CFG&&!CFG.mgr&&emp(U.emp).wp!=CFG.login)return '<section>您的帳號尚未綁定員工，請聯絡店長。</section>';const e=emp(U.emp),ds=week();let h=`${CFG?.mgr?'':'<div class=row><select data-a=emp>'+EMP.map(x=>`<option value=${x.id} ${x.id==U.emp?'selected':''}>${x.n}</option>`).join('')+'</select>'}<b>${e.n}</b> <span class=mute>${e.r}，時薪 NT${e.rate}/h</span></div>`;
 const pend=[];Object.entries(S.off[e.id]).forEach(([k,a])=>a.forEach(x=>{if(x.st=='pend')pend.push([k,x])}));
 pend.forEach(([k,x])=>{const d=pd(k);h+=`<div class=card><b>班次變動確認：店長調整了您的排班</b><div class=big>${lb(d)}</div><div class=big>${fh(x.s)} - ${fh(x.e)}</div><div class=mute>同意後才會正式生效</div><div class=row style="margin-top:8px"><button class="b p" data-a=ack data-k=${k}>✅ 同意此安排</button><button class=b data-a=obj data-k=${k}>💬 有異議，聯絡店長</button></div></div>`});
 const sh=okS(e.id,TK),a=S.at[e.id][TK]||{};
 h+=`<section><h2>今日打卡（${lb(TODAY)}）</h2><div class=punch>`;
 if(!sh.length)h+=clo(TK)?'<div class=mute>今日店休</div>':'<div class=mute>今日無排班，無需打卡</div>';
 else{const cls=!a.i?'in':!a.o?'out':'dn',tx=!a.i?'點我<br>上班打卡':!a.o?'點我<br>下班打卡':'今日出勤<br>已完成';
  h+=`<div class=mute>📍 當前定位：門店範圍內（距離 15 米） · 今日班次 ${sh.map(x=>fh(x.s)+'-'+fh(x.e)).join('，')}</div><button class="disc ${cls}" id=disc ${cls=='dn'?'disabled':''}>${tx}</button><div class=mute>${cls=='dn'?'':'長按 0.5 秒打卡，防止誤觸'}</div>`;

 else if(a=='obj'){S.obj[U.emp+d.k]=1;toast('已通知店長，請等待溝通')}
 else if(a=='cd'){const k=d.k,o=S.off[U.emp][k]||[];mask(`<h2>${lb(pd(k))}</h2><p>${o.length?o.map(x=>fh(x.s)+'-'+fh(x.e)+(x.st=='ok'?'':'（待同意）')).join('<br>'):'當天休息'}</p><div class=row><button class="b p" data-a=rep data-k=${k}>✏️ 修改/重報此日空閒時段</button><button class=b data-a=close>關閉</button></div>`);return}
 else if(a=='rep'){U.wk=mon(pd(d.k));U.focus=d.k;hideM()}
 else if(a=='close'){hideM();return}
 else if(a=='adopt'){const targets=[];EMP.forEach(e=>week().forEach(x=>{const k=ymd(x),av=S.av[e.id][k]||[],next=rng(av).map(r=>({s:r[0],e:r[1],st:'ok'})),cur=S.off[e.id][k]||[];if(x>=TODAY&&!clo(k)&&av.length&&JSON.stringify(cur.map(v=>[v.s,v.e]).sort())!==JSON.stringify(next.map(v=>[v.s,v.e]).sort()))targets.push({e,k,next,had:cur.length>0})}));if(!targets.length){toast('本週沒有需要採納或更新的最新意向');return}const updates=targets.filter(t=>t.had).length;if(!confirm(`確認一鍵採納 ${targets.length} 筆最新意向？其中 ${updates} 筆會更新已有正式班次。此操作會直接更新正式班表。`))return;targets.forEach(t=>{S.off[t.e.id][t.k]=t.next;delete S.obj[t.e.id+t.k]});save();toast(`已確認並採納 ${targets.length} 筆意向（含更新 ${updates} 筆原班次）`)}
 else if(a=='notice-read'){markNotificationRead(+d.id);return}
  else if(a=='cell'){drawer(d.e,d.d);return}
 else if(a=='chk'){chk();return}
 else if(a=='save'){const r=chk();if(!r)return;const g=$('#dg'),id=g.dataset.id,k=g.dataset.k,av=S.av[id][k]||[],ch=r.some(x=>!cov(av,x.s,x.e));S.off[id][k]=r.map(x=>({...x,st:ch?'pend':'ok'}));delete S.obj[id+k];hideM();toast(ch?'與員工申報不符，已推送給員工確認':'已儲存並生效')}
 else if(a=='del'){const g=$('#dg');S.off[g.dataset.id][g.dataset.k]=[];hideM();toast('已清空班次')}
 else if(a=='pin'||a=='pout'){const n=new Date(),h=n.getHours()+n.getMinutes()/60,t=a=='pin'?'i':'o',r=S.at[d.e][TK]||(S.at[d.e][TK]={});r[t]=h;r[t+'by']=1;toast('已代'+(a=='pin'?'簽到':'簽退'))}
 else if(a=='disp'){const f=EMP.find(e=>!S.off[e.id][TK]?.length);if(f){S.off[f.id][TK]=[{s:17,e:21.5,st:'pend'}];toast(`已向${f.n}派單，待其同意`)}else toast('今日無可呼叫的休息員工')}
 else if(a=='out'){sb.auth.signOut().then(()=>location.reload());return}
 else if(a=='pw'){const p=prompt('請輸入新密碼（至少 6 碼）');if(p)staff('reset',{emp_id:d.e,password:p});return}
 else if(a=='manager-profile'){const name=$('#mn').value.trim(),title=$('#mt').value.trim()||'店長',rate=Number($('#mr').value);if(!name){toast('請填寫姓名');return}if($('#mr').value.trim()===''||!Number.isFinite(rate)||rate<0){toast('請填寫有效的時薪');return}(async()=>{const u=await sb.auth.getUser();if(u.error||!u.data.user){toast('無法確認目前登入帳號');return}const id='mgr_'+u.data.user.id;const a=await sb.from('emp_data').insert({emp_id:id,name,title,rate,email:CFG.login,user_id:u.data.user.id,av:{},off:{},punches:{},sub:{},obj:{},acks:{}});if(a.error){toast('建立失敗：'+a.error.message);return}CFG.me=id;U.emp=id;await load();U.role='e';render();toast('店長員工資料已建立並綁定目前帳號')})() ;return}
 else if(a=='login'){doLogin();return}
 else if(a=='cw'){const w=+d.w,i=S.closed.wd.indexOf(w);if(i<0){S.closed.wd.push(w);const n=purge(k=>pd(k).getDay()==w);toast('已設為每週店休'+(n?'，移除 '+n+' 筆原有班次':''))}else S.closed.wd.splice(i,1)}
 else if(a=='cadd'){const k=$('#cd').value;if(!k){toast('請選擇日期');return}S.closed.dates[k]=$('#cn').value.trim();const n=purge(x=>x==k);toast('已新增店休日'+(n?'，移除 '+n+' 筆原有班次':''))}
 else if(a=='cdel'){delete S.closed.dates[d.k]}
 else if(a=='addemp'){const n=$('#en').value.trim();if(!n){toast('請輸入姓名');return}if(CFG){staff('add',{name:n,title:$('#er2').value.trim()||'員工',rate:+$('#ert').value||0,email:$('#ew').value.trim().toLowerCase(),password:$('#ep').value});return}toast('正式系統必須先完成登入與伺服器連線')}
 else if(a=='rm'){if(U.del!=d.e){U.del=d.e;render();return}U.del=null;if(CFG){staff('remove',{emp_id:d.e});return}toast('正式系統必須先完成登入與伺服器連線')}

 else if(a=='mm')U.mm=d.v=='0'?new Date(TODAY.getFullYear(),TODAY.getMonth(),1):new Date(U.mm.getFullYear(),U.mm.getMonth()+ +d.v,1);
 else if(a=='exp'){const y=U.mm.getFullYear(),m=U.mm.getMonth(),L=['日期,員工,班次,狀態'];for(let i=1;i<=new Date(y,m+1,0).getDate();i++){const k=ymd(new Date(y,m,i));EMP.forEach(e=>(S.off[e.id][k]||[]).forEach(x=>L.push([k,e.n,fh(x.s)+'-'+fh(x.e),x.st=='ok'?'已生效':'待同意'].join(','))))}mask(`<h2>${y}年${m+1}月 排班月報（CSV）</h2><textarea readonly>${L.join('\n')}</textarea><div class=mute>全選複製後貼上到 Excel 即可</div><div class=row><button class=b data-a=close>關閉</button></div>`);return}
 save();render()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.tagName=='SELECT')return;if(b.tagName=='TD'&&e.target.closest('button'))return;act(b.dataset.a,b.dataset)});
document.addEventListener('change',e=>{const s=e.target;if(s.dataset.a=='emp'){U.emp=s.value;render()}else if(s.dataset.a=='chk')chk()});
$('#m').addEventListener('click',e=>{if(e.target.id=='m')hideM()});
let ht;document.addEventListener('pointerdown',e=>{const b=e.target.closest('#disc');if(!b||b.disabled)return;b.classList.add('hold');ht=setTimeout(()=>{if(CFG){sb.rpc('punch_me').then(r=>{if(r.error)toast('打卡失敗');else{load();toast('打卡成功')}});return}const id=U.emp,a=S.at[id][TK]||(S.at[id][TK]={}),n=new Date();a[a.i==null?'i':'o']=n.getHours()+n.getMinutes()/60;save();render();toast('打卡成功')},500)});
['pointerup','pointerleave','pointercancel'].forEach(t=>document.addEventListener(t,e=>{if(e.target.closest&&e.target.closest('#disc')||t!='pointerleave'){clearTimeout(ht);document.querySelector('#disc')?.classList.remove('hold')}}));
if(!sb){$('#app').innerHTML='<section><h2>系統尚未完成正式環境設定</h2><p>請管理員在部署環境設定 Supabase Project URL 與 anon public key。為保護正式員工資料，系統不再提供本機演示模式或演示資料重置。</p></section>';$('#lg').hidden=true;}else{sb.auth.getSession().then(({data})=>data.session?enter(data.session):showLogin())}
</script></body></html>
